name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pyspark==3.5.3 \
            pytest \
            chispa \
            ruff \
            black

      # Lint is informational for now (Databricks notebooks are excluded via pyproject.toml).
      - name: Run Ruff
        continue-on-error: true
        run: ruff check .

      - name: Check Black formatting
        continue-on-error: true
        run: black --check .

      # pytest is the gating check — runs the shared recon_logic module the notebooks import.
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
